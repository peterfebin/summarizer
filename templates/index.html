<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summarizer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f4f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 2px 24px rgba(0, 0, 0, 0.08);
            padding: 2.5rem;
            width: 100%;
            max-width: 740px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #111;
        }

        .subtitle {
            margin-top: 0.3rem;
            color: #888;
            font-size: 0.9rem;
        }

        textarea {
            margin-top: 1.75rem;
            width: 100%;
            height: 220px;
            padding: 1rem;
            border: 1.5px solid #e4e4e7;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.65;
            font-family: inherit;
            color: #333;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus { border-color: #6366f1; }
        textarea::placeholder { color: #c0c0c0; }

        button {
            margin-top: 1rem;
            width: 100%;
            padding: 0.85rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover:not(:disabled) { background: #4f46e5; }
        button:disabled { background: #a5b4fc; cursor: not-allowed; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #dc2626;
            font-size: 0.9rem;
            display: none;
        }

        .results {
            margin-top: 2rem;
            display: none;
        }

        .results-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #aaa;
            margin-bottom: 1rem;
        }

        .bullet {
            display: flex;
            gap: 0.85rem;
            padding: 0.8rem 0;
            border-bottom: 1px solid #f4f4f5;
            line-height: 1.65;
            color: #222;
            font-size: 0.95rem;
        }

        .bullet:last-child { border-bottom: none; }

        .dot {
            color: #6366f1;
            font-size: 1.1rem;
            flex-shrink: 0;
            line-height: 1.65;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Summarizer</h1>
        <p class="subtitle">Paste any text and get a 6-point summary powered by Groq.</p>

        <textarea id="content" placeholder="Paste your text here..."></textarea>

        <button id="btn" onclick="summarize()">Summarize</button>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <div class="results-label">Summary</div>
            <div id="bullets"></div>
        </div>
    </div>

    <script>
        async function summarize() {
            const content = document.getElementById('content').value.trim();
            const btn = document.getElementById('btn');
            const errorEl = document.getElementById('error');
            const results = document.getElementById('results');
            const bullets = document.getElementById('bullets');

            if (!content) {
                showError('Please paste some text first.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div>Summarizing...';
            errorEl.style.display = 'none';
            results.style.display = 'none';

            try {
                const res = await fetch('/summarize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.error || 'Something went wrong.');
                    return;
                }

                const lines = data.summary
                    .split('\n')
                    .map(l => l.replace(/^[•\-\*]+\s*/, '').trim())
                    .filter(l => l.length > 0);

                bullets.innerHTML = lines.map(text =>
                    `<div class="bullet"><span class="dot">•</span><span>${text}</span></div>`
                ).join('');

                results.style.display = 'block';

            } catch {
                showError('Could not reach the server.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Summarize';
            }
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
